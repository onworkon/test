<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>onworkon — About on</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="preload" href="./assets/PPSupplyMono-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="mobile-screen" aria-label="About on">
      <section class="conversation" aria-labelledby="section-title">
        <h1 class="message__text" id="section-title">About on</h1>
      </section>
      <form class="page-navigation" aria-label="Page navigation" novalidate>
        <label class="page-code-label">
          <span aria-hidden="true">:</span>
          <span class="sr-only">Page code</span>
          <input class="page-code-input" name="page-code" type="text" value="about" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="page-code-help" />
        </label>
        <span class="sr-only" id="page-code-help">Enter home, card, work, client, about, portfolio, or contact, then press Enter to navigate.</span>
        <p class="page-code-error" id="page-code-error" role="status" hidden></p>
      </form>
      <img class="brand-mark" src="./assets/logo.svg" alt="" width="54" height="40" />
    </main>
    <script type="module" src="./page-navigation.js"></script>
  </body>
</html>
