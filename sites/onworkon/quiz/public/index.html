<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFF6DA">
  <title>정책 퀴즈</title>
  <link rel="stylesheet" href="/quiz/quiz.css">
  <script src="/quiz/participant.js" defer></script>
</head>
<body class="quiz-page">
  <main class="quiz-shell quiz-landing">
    <header id="landing-header" class="quiz-landing-header">
      <p class="quiz-landing-kicker">2026 강동송파 학생참여위원회</p>
      <p class="quiz-landing-title">당신의 정책, 선택은?</p>
    </header>
    <header id="participant-header" class="quiz-header" hidden><div class="quiz-brand">정책 퀴즈</div></header>
    <p id="test-notice" class="quiz-test" hidden>현재는 테스트 문항입니다.</p>
    <section id="stage" class="quiz-card" aria-busy="true">
      <h1 class="quiz-waiting" aria-label="대기중" tabindex="-1">대기중<span class="quiz-wait-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
    </section>
    <p id="error" class="quiz-error" role="alert" hidden></p>
    <button id="retry" class="quiz-button quiz-secondary" type="button" hidden>다시 연결</button>
    <p id="connection" class="quiz-sr-only" role="status" aria-live="polite"></p>
    <noscript><p class="quiz-error">퀴즈에 참여하려면 JavaScript를 켜 주세요.</p></noscript>
  </main>
</body>
</html>
